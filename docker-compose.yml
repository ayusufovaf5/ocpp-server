x-app-env: &app-env
  API_HOST: 0.0.0.0
  API_PORT: 8000
  OCPP16_PORT: 9000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  PG_HOST: postgres
  PG_PORT: 5432
  PG_USER: opencpo
  PG_PASSWORD: ocpp123
  PG_DATABASE: opencpo
  REDIS_URL: redis://redis:6379/0
  REDIS_STATE_TTL_SECONDS: ${REDIS_STATE_TTL_SECONDS:-86400}
  OUTBOUND_CALL_TIMEOUT_SECONDS: ${OUTBOUND_CALL_TIMEOUT_SECONDS:-15}
  OCPP_HEARTBEAT_INTERVAL: 60
  HEARTBEAT_TIMEOUT_SECONDS: 120
  HEARTBEAT_CHECK_INTERVAL_SECONDS: 30
  OFFLINE_SESSION_GRACE_PERIOD_SECONDS: ${OFFLINE_SESSION_GRACE_PERIOD_SECONDS:-300}
  API_KEY: ${API_KEY:-dev-api-key-change-me}
  OCPP_CHARGE_POINT_ALLOWLIST: ${OCPP_CHARGE_POINT_ALLOWLIST:-*}
  EVPOINT_LIVE_UPDATE_URL: ${EVPOINT_LIVE_UPDATE_URL:-http://host.docker.internal:5055/Charging/ocpp-live-update}
  EVPOINT_CA_BUNDLE: ${EVPOINT_CA_BUNDLE:-}
  EVPOINT_SSL_VERIFY: ${EVPOINT_SSL_VERIFY:-false}
  EVPOINT_PUSH_MAX_ATTEMPTS: ${EVPOINT_PUSH_MAX_ATTEMPTS:-3}
  EVPOINT_PUSH_BACKOFF_SECONDS: ${EVPOINT_PUSH_BACKOFF_SECONDS:-0.5}
  EVPOINT_PUSH_TIMEOUT_SECONDS: ${EVPOINT_PUSH_TIMEOUT_SECONDS:-5}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opencpo
      POSTGRES_PASSWORD: ocpp123
      POSTGRES_DB: opencpo
    ports:
      - "${OCPP_PG_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencpo -d opencpo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  ocpp16:
    build: .
    # Host 9010 so EvPointOCPP can own Windows port 9000.
    ports:
      - "${OCPP16_PORT:-9010}:9000"
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "ocpp16.app:app", "--host", "0.0.0.0", "--port", "9000"]

volumes:
  postgres_data:
